; Data-driven feature list. Feature sections become menu entries; reserved config sections (Overlay, ItemDefaults, Hotkeys) do not.
; Each feature's 'category' decides which TAB it appears on
; (tab order: Items, Battle, XP/Job, Stats, Norende, Friends; XP/Job and Stats have subtabs).
;
; HOW AN ENTRY WORKS   root -> chain -> (foreach, foreach2) -> actions
;   root_class/root_method   static zero-arg method that returns an object (e.g. Hikari.get_GameData). Omit for static_array entries.
;   chain                    instance zero-arg steps joined with '>' (no spaces). A step may take UI inputs: GetMember(#0)
;   foreach_count/_item      optional loop: for i in 0..count-1 take obj.foreach_item(i); foreach2_* nests a second loop
;   class                    class that declares the actions below (used to validate at startup)
;   method / method2..16     calls, run in order on each target; their args are  final_args / final_args2..4
;   set_field                write a field instead of calling a method
;   static_array(_restore)   overwrite (or restore) a static float[] on 'class'
;   final_args               comma list: #N = UI input N, or literals  i:123  l:0  b:1  f:1.5  s:text  y:5(byte)  n:0(null)
;   arg_types/arg_labels/arg_defaults   UI inputs (max 3): int,long,byte,bool,float,string
;   constant=hp/mp/bp/steal   continuous game hooks (no trainer refill timer)
;   enabled_by_default=0/1   initial toggle state
;   repeat_ms                optional timer for other custom features
; Anything that doesn't resolve in the live game shows "(unavailable)" instead of crashing.
; Party slots are 1-4 (1 = first character). A slot with nobody in it reports an error.

[Overlay]
; 0 = opaque, 100 = invisible. Restart the trainer after changing defaults.
transparency_percent=35
window_x=11
window_y=6
window_width=580
window_height=806

[ItemDefaults]
; Used when selecting a valid item or leaving its ID field. Quantities remain editable.
consumables=10
weapons=1
armor=1
accessories=1
other=10

; ================= ITEMS =================
[add_item]
category=Items
label=Add item (by ID - use the search box below)
notes=Adds Quantity of the item with this ID to your inventory. The game may cap each item at 99.
arg_types=int,int
arg_labels=Item ID,Quantity
arg_defaults=0,10
root_class=Hikari
root_method=get_GameData
chain=GetParty
class=PartyState
method=AddItem
final_args=#0,#1
[add_item_alt]
category=Items
label=Add item (alternate route)
notes=Same as above but reaches the party another way. Try this if the first one says the root object is unavailable.
arg_types=int,int
arg_labels=Item ID,Quantity
arg_defaults=0,10
root_class=LayoutGameLibrary
root_method=GetParty
class=PartyState
method=AddItem
final_args=#0,#1
[set_gil]
category=Items
label=Set Gil
notes=Sets your Gil (0 to 9,999,999).
arg_types=int
arg_labels=Gil
arg_defaults=0
root_class=Hikari
root_method=get_GameData
chain=GetParty
class=PartyState
method=SetGIL
final_args=#0
